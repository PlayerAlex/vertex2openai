name: GHCR CI
permissions:
  contents: read
  packages: write
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: lowercase repository name
      run: echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}
      
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ env.IMAGE_NAME }}:latest --tag ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

    - name: Verify container health
      run: |
        docker run --detach --name healthcheck --health-interval=2s --health-start-period=2s -e API_KEY=ci-healthcheck-only ghcr.io/${{ env.IMAGE_NAME }}:latest
        for attempt in {1..30}; do
          state=$(docker inspect --format '{{.State.Health.Status}}' healthcheck)
          if [ "$state" = healthy ]; then exit 0; fi
          if [ "$state" = unhealthy ]; then break; fi
          sleep 2
        done
        docker logs healthcheck
        exit 1

    - name: Remove test container
      if: always()
      run: docker rm -f healthcheck || true

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push the Docker image
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        docker push ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        docker push ghcr.io/${{ env.IMAGE_NAME }}:latest
